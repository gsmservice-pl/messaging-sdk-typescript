name: Publish Package to npmjs

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the release
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      # Trusted publishing requires npm >=11.5.1.
      - name: Set up npm with OIDC support
        run: npm install --global npm@11 --registry=https://registry.npmjs.org/

      - name: Verify the release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node <<'NODE'
          const { version } = require('./package.json');
          const releaseVersion = process.env.RELEASE_TAG.replace(/^v/, '');
          if (version !== releaseVersion) {
            throw new Error(`Release tag ${process.env.RELEASE_TAG} does not match package version ${version}`);
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Build the package
        run: npm run build

      # Configure npm-publish.yml as a trusted publisher on npmjs.com.
      # npm uses OIDC and adds provenance automatically; no NPM_TOKEN is needed.
      - name: Publish to npm
        env:
          NPM_DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
        run: npm publish --access public --ignore-scripts --tag "$NPM_DIST_TAG" --registry=https://registry.npmjs.org/
